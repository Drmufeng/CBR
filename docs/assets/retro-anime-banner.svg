    <path d="M574 112l12-18 12 13 14-22 28 27" fill="none" stroke="#BE185D" stroke-width="3"/><path d="M650 87h59M650 99h48M650 111h54" stroke="#BE185D" stroke-width="3"/><text x="574" y="130">MAPE · RMSE · export</text>
  </g>
</svg>

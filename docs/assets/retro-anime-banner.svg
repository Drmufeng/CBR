<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-labelledby="cbr-title cbr-desc">
  <title id="cbr-title">Case based lifecycle cost estimation workflow</title>
  <desc id="cbr-desc">A four-step loop from vehicle cases and similarity search to lifecycle cost estimates and validation.</desc>
  <defs><marker id="cbr-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#64748B"/></marker></defs>
  <rect x="8" y="8" width="744" height="164" rx="12" fill="#FFFBEB" stroke="#FCD34D"/>
  <g fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#cbr-arrow)"><path d="M166 104H198"/><path d="M342 104H374"/><path d="M518 104H550"/></g>
  <text x="28" y="34" fill="#422006" font-family="Arial,sans-serif" font-size="18" font-weight="700">CASE → LCC → VALIDATION</text>
  <text x="28" y="54" fill="#92400E" font-family="Arial,sans-serif" font-size="11">EV LIFECYCLE COST ESTIMATION</text>
  <g font-family="Arial,sans-serif" font-size="11" fill="#422006">
    <rect x="28" y="72" width="138" height="64" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
    <path d="M45 112l10-18h48l15 18v11H45z" fill="#FB923C" stroke="#9A3412" stroke-width="2"/><circle cx="62" cy="124" r="7" fill="#422006"/><circle cx="101" cy="124" r="7" fill="#422006"/><path d="M65 94l8-10h20l8 10" fill="#FED7AA" stroke="#9A3412" stroke-width="2"/><text x="45" y="134">vehicle cases</text>
    <rect x="200" y="72" width="142" height="64" rx="8" fill="#ECFDF5" stroke="#86EFAC"/>
    <circle cx="231" cy="101" r="15" fill="#A7F3D0" stroke="#047857" stroke-width="2"/><circle cx="277" cy="101" r="15" fill="#A7F3D0" stroke="#047857" stroke-width="2"/><path d="M246 101h16" stroke="#047857" stroke-width="3"/><text x="218" y="130">similarity search</text>
    <rect x="374" y="72" width="144" height="64" rx="8" fill="#EFF6FF" stroke="#93C5FD"/>
    <rect x="399" y="84" width="48" height="32" rx="4" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><path d="M409 100h28M423 90v20" stroke="#1D4ED8" stroke-width="3"/><path d="M461 93h37M461 103h29M461 113h33" stroke="#1D4ED8" stroke-width="3"/><text x="399" y="130">LCC estimate</text>
